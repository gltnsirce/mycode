---
- name: Install Kubernetes packages
  hosts: k8s
  become: true

  vars:
    kubernetes_minor_version: "1.35"

  tasks:

    - name: Install required APT packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /tmp/kubernetes-release.key
        owner: root
        group: root
        mode: '0644'

    - name: Convert Kubernetes repository key to GPG keyring
      ansible.builtin.shell:
        cmd: >
          gpg --dearmor
          --yes
          -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: >
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor_version }}/deb/ /
        filename: kubernetes
        state: present

    - name: Update APT package index
      ansible.builtin.apt:
        update_cache: true

    - name: Install kubelet kubeadm kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
